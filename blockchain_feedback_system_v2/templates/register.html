{% extends "base.html" %}
{% block title %}Register · Blockchain Feedback{% endblock %}
{% block content %}
<section class="panel auth-panel">
  <h1>Create student account</h1>
  <p class="muted">New registrations create student accounts. Admin accounts must be configured separately.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label for="username">Username</label>
    <input id="username" name="username" minlength="3" maxlength="40" autocomplete="username" required>
    <label for="password">Password</label>
    <input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
    <label for="confirm_password">Confirm password</label>
    <input id="confirm_password" name="confirm_password" type="password" minlength="8" autocomplete="new-password" required>
    <button type="submit">Register</button>
  </form>
  <p>Already registered? <a href="{{ url_for('login') }}">Log in</a></p>
</section>
{% endblock %}
