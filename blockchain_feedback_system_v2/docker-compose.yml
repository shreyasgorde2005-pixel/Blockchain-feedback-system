services:
  feedback:
    build: .
    ports:
      - "127.0.0.1:5000:5000"
    env_file:
      - .env
    environment:
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FEEDBACK_DATABASE: /app/data/feedback.db
    volumes:
      - feedback-data:/app/data
    restart: unless-stopped

volumes:
  feedback-data:
